[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomechanics"
version = "0.1.0"
description = "Modular biomechanics analysis and force prediction"
requires-python = ">=3.9,<3.10"
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]